<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Solio</title>
<meta name="description" content="Solio : localisateur de terrasses ensoleillées autour de toi.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f131a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Solio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Outfit:wght@200;300&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="map" aria-label="Carte des ombres"></canvas>

  <header class="top" id="top">
    <button class="roundbtn glass" id="back" aria-label="Retour aux meilleurs spots"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <label class="where glass">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.400-6.500 11-6.500 11z"/><circle cx="12" cy="10" r="2.300"/></svg>
      <span class="wt"><small>Autour de</small><b id="wname">–</b></span>
      <svg class="i chev" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg>
      <select id="from" aria-label="Point de départ"></select>
    </label>
    <button class="sunbtn glass" id="fSun" aria-pressed="true" title="Seulement les terrasses au soleil">
      <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.500v2.500M12 19v2.500M2.500 12H5M19 12h2.500M5.300 5.300l1.800 1.800M16.900 16.900l1.800 1.800M5.300 18.700l1.800-1.800M16.900 7.100l1.800-1.800"/></svg>
      <b id="cnt">–</b><span class="sr">terrasses, au soleil seulement</span>
    </button>
  </header>

  <section class="panel glass" id="panel">
    <button class="grab" id="grab" aria-expanded="false" aria-label="Afficher la liste"></button>
    <div class="phead">
      <div class="seg" id="seg" role="group" aria-label="Boire ou manger">
        <i class="ind" id="ind"></i>
        <button data-c="all" aria-pressed="true">Tout</button>
        <button data-c="boire" aria-pressed="false">Boire</button>
        <button data-c="manger" aria-pressed="false">Manger</button>
      </div>
      <span class="grow"></span>
      <button class="chip" id="fShade" aria-pressed="false" title="Afficher aussi les terrasses à l’ombre">Terrasses à l’ombre</button>
      <button class="chip" id="rad" aria-label="Changer le rayon">400 m</button>
    </div>

    <div class="tray" id="tray"></div>

    <div class="time">
      <div class="trow">
        <div class="tbig" id="tbig" aria-live="off">12<i>h</i>30</div>
        <div class="tmeta">
          <label class="datebtn"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span id="dlabel">–</span><input type="date" id="date" aria-label="Date"></label>
          <span class="sunspan" id="sunspan"></span>
          <button class="now" id="now">Maintenant</button>
        </div>
        <button class="round" id="play" aria-label="Lire la journée"></button>
      </div>
      <canvas id="dial" tabindex="0" role="slider" aria-label="Heure" aria-valuemin="420" aria-valuemax="1380" aria-valuenow="750"></canvas>
    </div>
  </section>

  <!-- intro -->
  <div class="scr splash on" id="splash" aria-label="Solio">
    <div class="sp-rays"></div>
    <div class="sp-sun2"></div>
    <div class="sp-conf" id="conf" aria-hidden="true"></div>
    <h1 class="sp-t" aria-label="Solio"><span style="--k:0">S</span><span style="--k:1">o</span><span style="--k:2">l</span><span style="--k:3">i</span><span class="sun-o on" style="--k:4"></span></h1>
    <p class="sp-s">Localisateur de terrasses ensoleillées autour de toi</p>
    <svg class="sp-cheers" viewBox="0 0 260 140" aria-hidden="true">
      <g class="gl gl-l"><path d="M-26 -88h52l-6 86h-40z" fill="#fff8" stroke="#2a1700" stroke-width="4" stroke-linejoin="round"/><path d="M-22 -60h44l-4 56h-36z" fill="#ff8a1f"/><rect x="-12" y="-52" width="14" height="14" rx="4" fill="#fff8"/><path d="M8 -120L-4 -50" stroke="#e8423a" stroke-width="7" stroke-linecap="round"/><circle cx="28" cy="-88" r="15" fill="#ffb000" stroke="#2a1700" stroke-width="4"/></g>
      <g class="gl gl-r"><path d="M-28 -84h56l-4 82h-48z" fill="#ffb42a" stroke="#2a1700" stroke-width="4" stroke-linejoin="round"/><path d="M-32 -84c-6-16 12-24 18-14 4-12 22-12 24 0 8-10 22-2 18 14z" fill="#fff" stroke="#2a1700" stroke-width="4" stroke-linejoin="round"/><path d="M28 -66h14c10 0 10 38 0 38h-16" fill="none" stroke="#2a1700" stroke-width="4" stroke-linecap="round"/><path d="M-12 -62v44M6 -68v48" stroke="#fff" stroke-opacity=".5" stroke-width="4" stroke-linecap="round"/></g>
      <g class="spark"><path d="M130 6V44M111 25H149M117 12L143 38M143 12L117 38" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="130" cy="25" r="7" fill="#fff"/></g>
    </svg>
  </div>

  <!-- choix -->
  <section class="scr ask" id="ask" hidden>
    <svg class="sunbg" viewBox="0 0 200 200" aria-hidden="true"><g fill="#ffb000" opacity=".9"><circle cx="100" cy="100" r="46"/></g><g stroke="#ffb000" stroke-width="7" stroke-linecap="round" opacity=".75"><path d="M100 14v22M100 164v22M14 100h22M164 100h22M39 39l15 15M146 146l15 15M39 161l15-15M146 54l15-15"/></g></svg>
    <svg class="cloud c1" viewBox="0 0 120 50" aria-hidden="true"><path fill="#fff" d="M22 46a16 16 0 0 1-1-32 22 22 0 0 1 42-4 18 18 0 0 1 31 14 14 14 0 0 1-2 22z"/></svg>
    <svg class="cloud c2" viewBox="0 0 120 50" aria-hidden="true"><path fill="#fff" d="M22 46a16 16 0 0 1-1-32 22 22 0 0 1 42-4 18 18 0 0 1 31 14 14 14 0 0 1-2 22z"/></svg>
    <div class="hd stg" style="--i:1"><h2>Un coin de<br><b>soleil</b> pour…</h2></div>
    <div class="tiles">
      <button class="tile t1 stg" data-c="boire" style="--i:3">
        <span class="go"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>C’est parti</span>
        <div class="art" aria-hidden="true">
          <svg viewBox="0 0 160 200">
            <defs><clipPath id="bowl"><path d="M30 34h100c0 52-22 82-50 88-28-6-50-36-50-88z"/></clipPath>
            <linearGradient id="spz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#ff6a1a"/></linearGradient></defs>
            <path d="M80 122v46M50 174h60" stroke="#2a1700" stroke-width="5" stroke-linecap="round" fill="none"/>
            <g class="straw"><path d="M96 4L82 104" stroke="#fff" stroke-width="8" stroke-linecap="round"/><path d="M93 24L90 44M89 58L86 78" stroke="#ff4d4d" stroke-width="8" stroke-linecap="round"/></g>
            <path d="M30 34h100c0 52-22 82-50 88-28-6-50-36-50-88z" fill="rgba(255,255,255,.42)"/>
            <g clip-path="url(#bowl)"><g class="liq"><rect x="20" y="62" width="120" height="80" fill="url(#spz)"/>
              <g fill="#fff"><circle class="bubble" cx="62" cy="108" r="4"/><circle class="bubble" cx="86" cy="112" r="3"/><circle class="bubble" cx="104" cy="104" r="4.500"/><circle class="bubble" cx="74" cy="116" r="2.500"/></g>
              <rect class="ice" x="52" y="66" width="24" height="24" rx="6" fill="#fff" fill-opacity=".6"/><rect class="ice i2" x="86" y="70" width="22" height="22" rx="6" fill="#fff" fill-opacity=".5"/></g></g>
            <path d="M30 34h100c0 52-22 82-50 88-28-6-50-36-50-88z" fill="none" stroke="#2a1700" stroke-width="5" stroke-linejoin="round"/>
            <path d="M42 44c2 26 10 44 26 56" stroke="#fff" stroke-opacity=".8" stroke-width="5" stroke-linecap="round" fill="none"/>
            <g transform="translate(126 34)"><circle r="22" fill="#ff8a00" stroke="#2a1700" stroke-width="4"/><circle r="14" fill="#ffc34d"/><path d="M0-14V14M-14 0H14M-10-10L10 10M10-10L-10 10" stroke="#ff8a00" stroke-width="2.500"/></g>
          </svg>
        </div>
        <b>Boire<br>un verre</b><span class="sub">Bars, cafés, pubs</span>
      </button>
      <button class="tile t2 stg" data-c="manger" style="--i:4">
        <span class="go"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Miam</span>
        <div class="art" aria-hidden="true">
          <svg viewBox="0 0 160 200">
            <path class="steam" d="M60 40c-8-8 8-14 0-24"/><path class="steam s2" d="M84 36c-8-8 8-14 0-24"/><path class="steam s3" d="M108 40c-8-8 8-14 0-24"/>
            <g class="spin">
              <circle cx="80" cy="100" r="66" fill="#fff" fill-opacity=".55"/>
              <circle cx="80" cy="100" r="58" fill="#e9a443" stroke="#2a1700" stroke-width="4"/>
              <circle cx="80" cy="100" r="49" fill="#ffd45e"/>
              <g fill="#d1452f" stroke="#2a1700" stroke-width="2.500"><circle cx="62" cy="80" r="9"/><circle cx="100" cy="86" r="9"/><circle cx="82" cy="118" r="9"/><circle cx="56" cy="114" r="7"/><circle cx="108" cy="116" r="7"/></g>
              <g fill="#3f9b4f"><ellipse cx="82" cy="78" rx="7" ry="4" transform="rotate(-30 82 78)"/><ellipse cx="66" cy="100" rx="7" ry="4" transform="rotate(40 66 100)"/><ellipse cx="96" cy="104" rx="7" ry="4" transform="rotate(10 96 104)"/></g>
              <path d="M80 100V51M80 100l42 24M80 100l-42 24" stroke="#2a1700" stroke-opacity=".35" stroke-width="2"/>
            </g>
          </svg>
        </div>
        <b>Manger<br>dehors</b><span class="sub">Restaurants, glaciers, snacks</span>
      </button>
    </div>
  </section>

  <!-- top 5 -->
  <section class="scr top5" id="top5" hidden>
    <header class="t5h stg" style="--i:0">
      <button class="roundbtn" id="t5back" aria-label="Changer : boire ou manger"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <label class="where2"><small>Autour de</small><b id="wname2">–</b><select id="from2" aria-label="Point de départ"></select></label>
      <button class="roundbtn" id="loc" aria-label="Autour de moi"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.500"/><circle cx="12" cy="12" r="8"/><path d="M12 1.500v3M12 19.500v3M1.500 12h3M19.500 12h3"/></svg></button>
    </header>
    <div class="t5t stg" style="--i:1"><h2 id="t5title">Top 5</h2><button class="chip walkchip" id="walkChip"><svg class="i" viewBox="0 0 24 24"><circle cx="13" cy="4.500" r="1.800"/><path d="M9 21l3-7 3 3v5M12 14l-1-5 4 1 2 3M10 9l-3 3"/></svg><span>10 min à pied max</span></button></div>
    <div class="t5list" id="t5list"></div>
    <footer class="t5f stg" style="--i:7"><button class="cta" id="t5map">Voir sur la carte<svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></footer>
  </section>

  <!-- fenêtre : distance à pied -->
  <div class="walk" id="walk" hidden>
    <div class="scrim" id="walkScrim"></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="walkT">
      <div class="sh-grip" aria-hidden="true"></div>
      <div class="sh-top"><small id="walkWhat">–</small><button class="roundbtn" id="walkX" aria-label="Fermer"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <h3 id="walkT">Jusqu’où veux-tu marcher&nbsp;?</h3>
      <div class="wread"><b id="walkMin">10</b><span>min à pied</span></div>
      <div class="wtrack" aria-hidden="true">
        <span class="walker" id="walker"><svg viewBox="0 0 24 24"><circle cx="12" cy="4" r="2.100" class="hd"/><path d="M12 7.200V14" class="bd"/><g class="lm l1"><path d="M12 8.600V13.600"/></g><g class="lm l2"><path d="M12 8.600V13.600"/></g><g class="lg g1"><path d="M12 14V21"/></g><g class="lg g2"><path d="M12 14V21"/></g></svg></span>
      </div>
      <input type="range" id="walkRange" min="3" max="20" step="1" value="10" aria-label="Minutes de marche maximum">
      <h3 class="h3b" id="sunT">Combien de min de soleil restantes au minimum&nbsp;?</h3>
      <div class="wread w2"><b id="sunV">30</b><span>min de soleil</span></div>
      <div class="wtrack" aria-hidden="true"><span class="walker sunner" id="sunner"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.500"/><path d="M12 1.500v3.500M12 19v3.500M1.500 12H5M19 12h3.500M4.600 4.600l2.500 2.500M16.900 16.900l2.500 2.500M4.600 19.400l2.500-2.500M16.900 7.100l2.500-2.500"/></svg></span></div>
      <input type="range" id="sunRange" min="15" max="120" step="15" value="30" aria-label="Minutes de soleil restantes minimum">
      <button class="cta" id="walkGo">Voir les terrasses ensoleillées<svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </section>
  </div>
</div>

<div class="ver" aria-hidden="true">v19</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Vue agrandie">
  <canvas id="lbc"></canvas>
  <div class="cap"><a id="lbn" target="_blank" rel="noopener"></a><span id="lbk"></span><a id="lbsv" target="_blank" rel="noopener" style="font-size:14px;font-weight:500">Street View ↗</a></div>
  <div class="row"><button id="lbPlan" aria-pressed="true">Plan et ombres</button><button id="lbPhoto" aria-pressed="false">Photo aérienne</button><button id="lbx">Fermer</button></div>
</div>
<script>
window.ZLOAD=(async()=>{const g=u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u);return r.json();});
  const [idx,roads,pl]=await Promise.all([g('zone/index.json'),g('zone/roads.json'),g('zone/places.json')]);
  window.ZIDX=idx;window.PLAN={r:roads.r,n:roads.n};window.PD=pl;})();
</script>
<script src="config.js"></script>
<script>
ZLOAD.then(()=>{const s=document.createElement('script');s.src='app.js';document.body.appendChild(s);},
  ()=>{const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:99;display:grid;place-content:center;padding:24px;text-align:center;font:16px system-ui;background:#fff8ec;color:#2b2217';d.innerHTML='<b>Impossible de charger les données.</b><br>Vérifie ta connexion puis recharge la page.';document.body.appendChild(d);});
</script>
<script>if("serviceWorker"in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!window.__rl){window.__rl=1;location.reload();}});addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}</script>
</body>
</html>
